name: Self-test (mock agent)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  behavioral-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The harness's own guards. The bundled scenarios below test the
      # contracts; these test the machinery that stops a verdict overclaiming.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate all bundled contracts
        run: python main.py validate

      - name: Run behavioral contract tests against the harness's own mock agent
        uses: ./
        with:
          agent: mock

      - name: Post results as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Agent Behavioral Test Report\n\n(no report found)';
            try {
              const content = fs.readFileSync('behavioral-test-report.md', 'utf8');
              if (content.trim()) body = content;
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
